services:
  postgres:
    image: postgres:15-alpine
    container_name: hoopmind_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hoopmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoopmind123}
      POSTGRES_DB: ${POSTGRES_DB:-hoopminddb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoopmind -d hoopminddb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hoopmind_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ml_models:/app/ml_models
    command: >
      sh -c "
        alembic upgrade head &&
        python data/seed_db.py &&
        python -m app.ml.train_models &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hoopmind_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000

volumes:
  postgres_data:
  ml_models:
